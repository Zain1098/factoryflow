name: factoryflow
description: FactoryFlow Manufacturing ERP - Production management system
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^3.3.2
  go_router: ^17.3.0
  supabase_flutter: ^2.9.0
  sqlite3: ^3.3.4
  sqlite3_flutter_libs: ^0.6.0+eol
  path_provider: ^2.1.5
  path: ^1.9.1
  intl: ^0.20.2
  image_picker: ^1.1.2
  connectivity_plus: ^7.2.0
  uuid: ^4.5.1
  shared_preferences: ^2.5.3
  equatable: ^2.0.7
  flutter_local_notifications: ^18.0.1
  google_sign_in: ^7.2.0
  local_auth: ^2.3.0
  flutter_secure_storage: ^9.2.4
  excel: ^4.0.6
  pdf: ^3.11.3
  printing: ^5.14.3
  # 12.x no longer applies the legacy Kotlin Gradle Plugin used by 11.x.
  # It stays compatible with this app's AGP 9 / Java 17 Android setup.
  share_plus: ^12.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
