  connectivity_plus: ^7.2.0
  uuid: ^4.5.1
  shared_preferences: ^2.5.3
  flutter_dotenv: ^6.0.1
  equatable: ^2.0.7

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
